<svg width="1600" height="580" viewBox="0 0 1600 580" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#374151" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#6B7280" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1600" height="580" fill="#FFFFFF"/>

  <!-- title -->
  <text x="800" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#1B2A4A">Semantic Lecture Retrieval and Question Answering using RAG</text>
  <text x="800" y="64" text-anchor="middle" font-size="13" fill="#6B7280">System architecture overview</text>

  <!-- ============ INDEXING PIPELINE ============ -->
  <text x="65" y="118" font-size="15" font-weight="700" fill="#1B2A4A">Indexing Pipeline</text>
  <line x1="65" y1="128" x2="1535" y2="128" stroke="#D1D5DB" stroke-width="1"/>

  <!-- Row 1 boxes: y=150, h=66 -->
  <!-- Box 1: Lecture Videos -->
  <g>
    <rect x="65" y="150" width="220" height="66" rx="4" fill="#FAFAFA" stroke="#2C3E50" stroke-width="1.1"/>
    <text x="175" y="188" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">Lecture Videos</text>
  </g>
  <line x1="285" y1="183" x2="313" y2="183" stroke="#374151" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Box 2: FFmpeg Audio Extraction -->
  <g>
    <rect x="315" y="150" width="220" height="66" rx="4" fill="#FAFAFA" stroke="#2C3E50" stroke-width="1.1"/>
    <text x="425" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">FFmpeg Audio</text>
    <text x="425" y="196" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">Extraction</text>
  </g>
  <line x1="535" y1="183" x2="563" y2="183" stroke="#374151" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Box 3: Whisper Large-v2 -->
  <g>
    <rect x="565" y="150" width="220" height="66" rx="4" fill="#FAFAFA" stroke="#2C3E50" stroke-width="1.1"/>
    <text x="675" y="188" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">Whisper Large-v2</text>
  </g>
  <text x="675" y="235" text-anchor="middle" font-size="11.5" font-style="italic" fill="#6B7280">Automatic Speech Recognition</text>
  <line x1="785" y1="183" x2="813" y2="183" stroke="#374151" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Box 4: Timestamped Transcript Chunks -->
  <g>
    <rect x="815" y="150" width="220" height="66" rx="4" fill="#FAFAFA" stroke="#2C3E50" stroke-width="1.1"/>
    <text x="925" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">Timestamped Transcript</text>
    <text x="925" y="196" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">Chunks</text>
  </g>
  <line x1="1035" y1="183" x2="1063" y2="183" stroke="#374151" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Box 5: BGE-M3 Embedding Generation -->
  <g>
    <rect x="1065" y="150" width="220" height="66" rx="4" fill="#FAFAFA" stroke="#2C3E50" stroke-width="1.1"/>
    <text x="1175" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">BGE-M3 Embedding</text>
    <text x="1175" y="196" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">Generation</text>
  </g>
  <text x="1175" y="235" text-anchor="middle" font-size="11.5" font-style="italic" fill="#6B7280">Dense Semantic Embeddings</text>
  <line x1="1285" y1="183" x2="1313" y2="183" stroke="#374151" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Box 6: Embedding Storage (Joblib) -->
  <g>
    <rect x="1315" y="150" width="220" height="66" rx="4" fill="#FAFAFA" stroke="#2C3E50" stroke-width="1.1"/>
    <text x="1425" y="178" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">Embedding Storage</text>
    <text x="1425" y="196" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">(Joblib)</text>
  </g>

  <!-- Connector between pipelines -->
  <path d="M1425 216 L1425 268 L675 268 L675 336" fill="none" stroke="#6B7280" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#arrow-dash)"/>
  <text x="1050" y="262" text-anchor="middle" font-size="11.5" fill="#6B7280">stored embeddings used for retrieval</text>

  <!-- divider -->
  <line x1="65" y1="292" x2="1535" y2="292" stroke="#E5E7EB" stroke-width="1"/>

  <!-- ============ RETRIEVAL PIPELINE ============ -->
  <text x="65" y="322" font-size="15" font-weight="700" fill="#1B2A4A">Retrieval Pipeline</text>
  <line x1="65" y1="332" x2="1535" y2="332" stroke="#D1D5DB" stroke-width="1"/>

  <!-- Row 2 boxes: y=340, h=66 -->
  <!-- Box 1: User Query -->
  <g>
    <rect x="65" y="340" width="220" height="66" rx="4" fill="#FAFAFA" stroke="#2C3E50" stroke-width="1.1"/>
    <text x="175" y="378" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">User Query</text>
  </g>
  <line x1="285" y1="373" x2="313" y2="373" stroke="#374151" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Box 2: Query Embedding (BGE-M3) -->
  <g>
    <rect x="315" y="340" width="220" height="66" rx="4" fill="#FAFAFA" stroke="#2C3E50" stroke-width="1.1"/>
    <text x="425" y="368" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">Query Embedding</text>
    <text x="425" y="386" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">(BGE-M3)</text>
  </g>
  <line x1="535" y1="373" x2="563" y2="373" stroke="#374151" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Box 3: Cosine Similarity Search -->
  <g>
    <rect x="565" y="340" width="220" height="66" rx="4" fill="#FAFAFA" stroke="#2C3E50" stroke-width="1.1"/>
    <text x="675" y="368" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">Cosine Similarity</text>
    <text x="675" y="386" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">Search</text>
  </g>
  <text x="675" y="425" text-anchor="middle" font-size="11.5" font-style="italic" fill="#6B7280">Vector Retrieval</text>
  <line x1="785" y1="373" x2="813" y2="373" stroke="#374151" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Box 4: Top-K Relevant Chunks -->
  <g>
    <rect x="815" y="340" width="220" height="66" rx="4" fill="#FAFAFA" stroke="#2C3E50" stroke-width="1.1"/>
    <text x="925" y="378" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">Top-K Relevant Chunks</text>
  </g>
  <line x1="1035" y1="373" x2="1063" y2="373" stroke="#374151" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Box 5: Llama 3.2 via Ollama -->
  <g>
    <rect x="1065" y="340" width="220" height="66" rx="4" fill="#FAFAFA" stroke="#2C3E50" stroke-width="1.1"/>
    <text x="1175" y="378" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">Llama 3.2 via Ollama</text>
  </g>
  <text x="1175" y="425" text-anchor="middle" font-size="11.5" font-style="italic" fill="#6B7280">Context-Aware Generation</text>
  <line x1="1285" y1="373" x2="1313" y2="373" stroke="#374151" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Box 6: Grounded Answer with Video References -->
  <g>
    <rect x="1315" y="340" width="220" height="66" rx="4" fill="#FAFAFA" stroke="#2C3E50" stroke-width="1.1"/>
    <text x="1425" y="368" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">Grounded Answer with</text>
    <text x="1425" y="386" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">Video References</text>
  </g>

  <!-- footer -->
  <line x1="65" y1="478" x2="1535" y2="478" stroke="#D1D5DB" stroke-width="1"/>
  <text x="800" y="508" text-anchor="middle" font-size="13" font-weight="700" fill="#1B2A4A">Technologies</text>
  <text x="800" y="532" text-anchor="middle" font-size="13" fill="#374151">Python  |  Whisper  |  BGE-M3  |  Ollama  |  Llama 3.2  |  Pandas  |  Joblib</text>
</svg>
